<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0c0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>FINN · Financial Investment Agent</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="desk-note"><b>FINN is built for your phone.</b> Open this URL on mobile, or use your browser's device mode. Data snapshot: NSE filings 3–15 Nov 2026, EOD prices to 13 Nov, screener fundamentals. The investor network is synthetic.</div>
<div class="shell" id="shell">
  <header class="top">
    <div class="brand">FIN<i>N</i></div>
    <div class="asof" id="asof"></div>
  </header>
  <main class="main" id="main">
    <section class="view on" id="v-today"></section>
    <section class="view" id="v-research"></section>
    <section class="view" id="v-network"></section>
  </main>
  <nav class="tabs" id="tabs">
    <button class="tab on" data-v="today"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M4 6h16M4 12h10M4 18h7"/></svg>Today</button>
    <button class="tab" data-v="research"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>Research</button>
    <button class="ask-fab" id="askBtn" aria-label="Ask FINN"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M6 6l2 2M16 16l2 2M6 18l2-2M16 8l2-2"/></svg></button>
    <button class="tab" data-v="network"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><circle cx="12" cy="12" r="2.5"/><circle cx="5" cy="6" r="2"/><circle cx="19" cy="7" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="18" r="2"/><path d="M10 10.5 6.5 7.5M14 11l3.3-2.6M10.3 13.8l-2.8 3.6M14 13.6l2.6 2.8"/></svg>Network</button>
    <button class="tab" data-v="alerts" id="alertsTab"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>Alerts</button>
  </nav>
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet"><div class="grab"></div><button class="x-btn" id="xBtn">×</button><div class="body" id="sheetBody"></div></div>
  <div class="toast" id="toast"></div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
